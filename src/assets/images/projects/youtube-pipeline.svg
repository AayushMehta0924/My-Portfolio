<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Content is kept inside x 110-690 / y 100-340 so object-cover crops at any card width never cut it -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#4c0519"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="800" height="470" fill="url(#bg)"/>
  <rect width="800" height="470" fill="url(#dots)"/>

  <!-- Step Functions orchestration bracket -->
  <rect x="110" y="118" width="580" height="80" rx="14" fill="none" stroke="#f472b6" stroke-opacity="0.65" stroke-width="1.8" stroke-dasharray="6 6"/>
  <text x="400" y="106" text-anchor="middle" fill="#f9a8d4" font-size="15" font-weight="700" letter-spacing="1.4">AWS STEP FUNCTIONS</text>

  <!-- Row A: serverless stages -->
  <g font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="122" y="134" width="118" height="48" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="2.5"/>
    <text x="181" y="164">EventBridge</text>

    <rect x="262" y="134" width="118" height="48" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="2.5"/>
    <text x="321" y="164">Lambda</text>

    <rect x="420" y="134" width="118" height="48" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="479" y="164">Glue</text>

    <rect x="560" y="134" width="118" height="48" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="619" y="164">Athena</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M240 158 H258"/>
    <path d="M538 158 H556"/>
  </g>
  <!-- Lambda -> Glue passes through the medallion layers below -->
  <path d="M380 158 H416" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-dasharray="3 4" marker-end="url(#arrow)"/>

  <!-- orchestration -> medallion layers -->
  <path d="M400 198 V246" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="4 5" marker-end="url(#arrow)"/>

  <!-- Row B: medallion layers -->
  <g font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="115" y="250" width="150" height="56" rx="10" fill="#1e293b" stroke="#c2773a" stroke-width="2.5"/>
    <text x="190" y="276">Bronze</text>
    <text x="190" y="296" font-size="13" font-weight="500" fill="#cbd5e1">raw · S3</text>

    <rect x="325" y="250" width="150" height="56" rx="10" fill="#1e293b" stroke="#cbd5e1" stroke-width="2.5"/>
    <text x="400" y="276">Silver</text>
    <text x="400" y="296" font-size="13" font-weight="500" fill="#cbd5e1">cleaned · S3</text>

    <rect x="535" y="250" width="150" height="56" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="610" y="276">Gold</text>
    <text x="610" y="296" font-size="13" font-weight="500" fill="#cbd5e1">curated · S3</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M265 278 H321"/>
    <path d="M475 278 H531"/>
  </g>
  <g font-size="12" font-weight="700" fill="#fda4af" text-anchor="middle" letter-spacing="0.6">
    <text x="293" y="268">DQ</text>
    <text x="503" y="268">DQ</text>
  </g>

  <text x="400" y="336" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700" letter-spacing="0.4">automated data-quality gating</text>
</svg>
