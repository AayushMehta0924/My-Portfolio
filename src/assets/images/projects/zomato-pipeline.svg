<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Content is kept inside x 110-690 / y 100-340 so object-cover crops at any card width never cut it -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="800" height="470" fill="url(#bg)"/>
  <rect width="800" height="470" fill="url(#dots)"/>

  <!-- Airflow orchestration bracket -->
  <rect x="110" y="118" width="580" height="80" rx="14" fill="none" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="1.8" stroke-dasharray="6 6"/>
  <text x="400" y="106" text-anchor="middle" fill="#67e8f9" font-size="15" font-weight="700" letter-spacing="1.4">APACHE AIRFLOW</text>

  <!-- Row A: ingest + transform -->
  <g font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="125" y="134" width="140" height="48" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="195" y="166">S3</text>

    <rect x="330" y="134" width="140" height="48" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="400" y="166">Snowflake</text>

    <rect x="535" y="134" width="140" height="48" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2.5"/>
    <text x="605" y="166">dbt</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M265 158 H326"/>
    <path d="M470 158 H531"/>
  </g>

  <!-- dbt marts -> AI layer -->
  <path d="M605 198 V226 H250 V246" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Row B: AI layer + serving -->
  <g font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="125" y="250" width="250" height="56" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
    <text x="250" y="275">OpenAI</text>
    <text x="250" y="296" font-size="13" font-weight="500" fill="#cbd5e1">enrichment · RAG · text-to-SQL</text>

    <rect x="425" y="250" width="250" height="56" rx="10" fill="#1e293b" stroke="#fb7185" stroke-width="2.5"/>
    <text x="550" y="275" font-size="20">Streamlit + SnowSight</text>
    <text x="550" y="296" font-size="13" font-weight="500" fill="#cbd5e1">analytics interface</text>
  </g>
  <path d="M375 278 H421" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <text x="400" y="336" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700" letter-spacing="0.6">10M+ orders</text>
</svg>
